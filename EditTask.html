<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="editmodal" class="hidden bg-black bg-opacity-50">
      <div class="bg-white w-72 rounded-md">
        <input
          type="text"
          id="editinput"
          placeholder="update task"
          class="w-full border-2 border-gray-200 rounded-md"
        />
        <div class="flex justify-between">
          <button id="cancelbtn" class="bg-red-500 text-white px-2 py-1">
            cancel
          </button>
          <button id="savebtn" class="bg-green-400 text-white px-2 py-1">
            Save
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
